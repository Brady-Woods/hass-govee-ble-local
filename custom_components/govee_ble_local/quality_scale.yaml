# Home Assistant Integration Quality Scale tracking for govee_ble_local.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# Note: this is a custom component. The official quality-scale tier is only
# validated/awarded for integrations merged into HA core; this file is an honest
# self-assessment against the same rules.
#
# Claimed tier: GOLD (manifest "quality_scale": "gold").
#
# Every Bronze/Silver/Gold rule is done or legitimately exempt.
# dependency-transparency depends on govee-ble-local being published to PyPI by
# the library's trusted-publishing release workflow (.github/workflows/release.yml);
# the manifest requires `govee-ble-local==1.1.0`, so the integration cannot even
# install until that release exists - publish the library first.
# Platinum's own three rules (async-dependency, inject-websession, strict-typing)
# are also met.
# Also outstanding for a core submission (not a rule failure): the bundled brand
# images are generic placeholders, not final artwork.

rules:
  # ------------------------------------------------------------------ Bronze
  action-setup:
    status: done
    comment: >
      The capture_session service action is registered (admin-only) in
      async_setup, not async_setup_entry, so it exists integration-wide. A
      targeted device whose entry isn't loaded gets an error entry in the
      response; no matching device raises a translated ServiceValidationError.
  appropriate-polling: done
  brands:
    status: done
    comment: >
      Bundled under custom_components/govee_ble_local/brand/ (served by HA's
      brands component for custom integrations). Generic placeholder artwork
      with no Govee trademarks; replace with final art before any submission.
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: >
      Full config-flow coverage (bluetooth discovery, user, secret read/cloud/
      manual, reauth and reconfigure steps plus the not_supported /
      already_configured / no_devices_found aborts) via
      pytest-homeassistant-custom-component; see tests/test_config_flow.py.
  dependency-transparency:
    status: done
    comment: >
      The sole dependency (govee-ble-local) is MIT, source on GitHub, and
      released to PyPI with CI-built wheels by its trusted-publishing workflow;
      the manifest pins `govee-ble-local==1.1.0`.
  docs-actions:
    status: done
    comment: >
      The capture_session service action is described in services.yaml +
      strings.json and documented in the README ("Entities & services").
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: >
      Setup is from passive BLE discovery (or a picker of already-discovered
      devices), which already implies the device is advertising and reachable;
      there is no host/credential to validate before creating the entry.
  test-before-setup:
    status: done
    comment: >
      Setup raises ConfigEntryNotReady unless a connectable scanner currently
      sees the device and its SKU is known/supported. A device that is
      advertising is accepted without a live connect+handshake (avoids a
      startup connect storm across many devices sharing scarce connection
      slots); the first poll runs in the background with backoff.
  unique-config-entry: done

  # ------------------------------------------------------------------ Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no configuration parameters.
  entity-unavailable:
    status: done
    comment: >
      Availability follows reachability (a connectable scanner sees the
      device's advertisements), not last-poll success: an advertising device
      stays controllable through transient poll failures; a vanished one goes
      unavailable after UNAVAILABLE_AFTER_FAILURES failed polls.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: >
      Secret-gated devices (smart plugs) that reject their stored key - wrong,
      or rotated by re-pairing - raise GoveeBleAuthError; polls map it to
      ConfigEntryAuthFailed and commands start reauth, which collects a new key
      (cloud lookup or manual entry).
  test-coverage:
    status: done
    comment: >
      >95% line coverage of the HA-facing layer, enforced by scripts/check.sh,
      against the Home Assistant release pinned in requirements_test.txt. The
      BLE transport/protocol layers are tested in the govee-ble-local library,
      including a fake-peripheral harness reproducing live failure modes.

  # -------------------------------------------------------------------- Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One physical device per config entry; there is no hub enumerating devices.
  entity-category:
    status: done
    comment: >
      RSSI, connection-failures, poll-interval, last-seen and last-connected
      sensors, the connectivity binary_sensor, and the self-test button are all
      EntityCategory.DIAGNOSTIC; the light/switch controls are primary.
  entity-device-class:
    status: done
    comment: >
      Diagnostic entities use signal_strength / duration / timestamp /
      connectivity device classes; the light and zone on/off switches have no
      applicable class.
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: >
      Failure modes (device out of range, transient BLE errors) are handled by
      graceful unavailability and coordinator backoff; the one user-actionable
      condition (a rejected secret key) is a reauth flow, not a repair issue.
  stale-devices:
    status: exempt
    comment: One device per entry; removing the entry removes the device.

  # ---------------------------------------------------------------- Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: >
      The only HTTP use (optional Govee-account secret lookup in the config
      flow) passes Home Assistant's shared aiohttp session to the library.
  strict-typing:
    status: done
    comment: >
      Fully typed with a shipped py.typed; verified with mypy under a config
      mirroring Home Assistant core's own strict settings (see mypy.ini). The
      govee-ble-local dependency also ships py.typed and passes mypy --strict.
