name: Validate

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "0 0 * * *"   # daily: catch HACS/hassfest rule changes over time

# Least privilege: every job only reads the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check & tests (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"   # match the production container runtime
      - name: Run quality gate
        run: bash scripts/check.sh

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned to a commit (the action only publishes a moving `main`); bumped by Dependabot.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main @ 2026-10-12
        with:
          category: integration

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned to a commit (the action only publishes a moving `master`); bumped by Dependabot.
      - uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master @ 2026-10-12
