name: Validate

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "0 0 * * *"   # daily: catch HACS/hassfest rule changes over time

# Least privilege: every job only reads the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check & tests (coverage gate, library ${{ matrix.lib }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The manifest declares a library range; test its floor (what an existing install
        # may still be on) and the newest release in it (what a fresh install gets).
        lib: [floor, newest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"   # match the production container runtime
      - name: Run quality gate
        env:
          LIB_VERSION: ${{ matrix.lib }}
        run: bash scripts/check.sh

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit (the action only publishes a moving `main`); bumped by Dependabot.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main @ 2026-10-12
        with:
          category: integration

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit (the action only publishes a moving `master`); bumped by Dependabot.
      - uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master @ 2026-10-12
